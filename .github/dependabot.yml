# Dependabot keeps dependencies current and opens a PR as soon as a CVE affects one of them.
# Weekly, with minor/patch bumps grouped into one PR, so it never floods the PR list.
# Major bumps (e.g. a new Next.js major) arrive as their own PR because they can break things.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ops"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
