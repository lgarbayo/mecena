# Dependabot keeps dependencies current and opens a PR as soon as a CVE affects one of them.
# Weekly, with minor/patch bumps grouped into one PR, so it never floods the PR list.
# Major bumps (e.g. a new Next.js major) arrive as their own PR because they can break things.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # @types/node must match the Node major we run (22 LTS, see engines and the Dockerfile).
      # Bump it by hand together with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ops"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the Node LTS line: odd majors (23, 25...) are short-lived and never become LTS.
      # Move to the next LTS (24) on purpose, together with engines and @types/node.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build"
