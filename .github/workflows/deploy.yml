# Deploys mecena.fly.dev on every push to main (and on demand from the Actions tab).
# Pull requests only run the checks.
# Needs the repo secret FLY_API_TOKEN: a deploy token scoped to the app,
#   fly tokens create deploy -a mecena -x 8760h | gh secret set FLY_API_TOKEN
# NEXT_PUBLIC_* are inlined at build time, so they come from repo *variables* (Settings >
# Secrets and variables > Actions > Variables) as build args. Unset = the Dockerfile defaults
# (empty RevenueCat key = mock paywall).
name: Deploy to Fly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'fly-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # --ha=false: db.json lives on one volume, so the app must stay on exactly one machine.
      - run: >-
          flyctl deploy --remote-only --ha=false
          --build-arg NEXT_PUBLIC_REVENUECAT_API_KEY="${{ vars.NEXT_PUBLIC_REVENUECAT_API_KEY }}"
          --build-arg NEXT_PUBLIC_REVENUECAT_ENTITLEMENT_ID="${{ vars.NEXT_PUBLIC_REVENUECAT_ENTITLEMENT_ID || 'mecena_pro' }}"
          --build-arg NEXT_PUBLIC_REVENUECAT_OFFERING_ID="${{ vars.NEXT_PUBLIC_REVENUECAT_OFFERING_ID || 'default' }}"
          --build-arg NEXT_PUBLIC_PURCHASES_MOCK="${{ vars.NEXT_PUBLIC_PURCHASES_MOCK }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
