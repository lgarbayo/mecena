# Mecena on Fly.io. Single machine on purpose: db.json writes are serialised in-process and the
# volume mounts on one machine only. Deploy with: fly deploy --ha=false
app = "mecena"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  MECENA_DATA_DIR = "/data"
  MECENA_PUBLIC_URL = "https://mecena.fly.dev"

[[mounts]]
  source = "mecena_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Public, cheap route (src/app/api/health). Fly only routes traffic to a machine that passes it, so a deploy that
  # fails to boot is visible in `fly status` / `fly checks list` instead of serving errors.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
